<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics for {{ short_code }}</title>
</head>
<body>
    <h1>Link Analytics</h1>
    <p><strong>Original URL:</strong> <a href="{{ url_instance.original_url }}" target="_blank">{{ url_instance.original_url }}</a></p>
    <p><strong>Short Link:</strong> <a href="/{{ url_instance.short_code }}" target="_blank">{{ request.build_absolute_uri }}/{{ url_instance.short_code }}</a></p>
    <p><strong>Total Clicks:</strong> {{ url_instance.clicks }}</p>
    <p><strong>Created At:</strong> {{ url_instance.created_at }}</p>
    <p><a href="{% url 'home' %}">Create another short link</a></p>
</body>
</html>
